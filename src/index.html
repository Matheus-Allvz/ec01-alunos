<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DevTech Academy - Alunos</title>
</head>
<body>
<h1>DevTech Academy - Alunos</h1>

<form id="form">
  <p><label>Nome <input type="text" id="nome" required></label></p>
  <p><label>Idade <input type="number" id="idade" min="1" required></label></p>
  <p>
    <label>Curso
      <select id="curso">
        <option>JavaScript</option>
        <option>Python</option>
        <option>Java</option>
      </select>
    </label>
  </p>
  <p><label>Nota Final <input type="number" id="nota" min="0" max="10" step="0.1" required></label></p>
  <button type="button" id="salvar">Cadastrar</button>
</form>

<table border="1">
  <thead>
    <tr><th>Nome</th><th>Idade</th><th>Curso</th><th>Nota Final</th><th>Situação</th><th>Ações</th></tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<h2>Relatórios</h2>
<button type="button" data-relatorio="aprovados">Alunos aprovados</button>
<button type="button" data-relatorio="mediaNotas">Média das notas</button>
<button type="button" data-relatorio="mediaIdades">Média das idades</button>
<button type="button" data-relatorio="nomes">Nomes em ordem alfabética</button>
<button type="button" data-relatorio="porCurso">Alunos por curso</button>
<pre id="relatorio"></pre>

<script src="aluno.js"></script>
<script src="app.js"></script>
</body>
</html>
